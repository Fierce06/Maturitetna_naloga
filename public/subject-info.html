<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Maturitetna naloga</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100 text-slate-800 page-index">
    <div class=" flex min-h-screen gap-6 p-4 md:p-8">
        <aside
            class="w-full max-w-[260px] rounded-2xl border border-slate-200 bg-white/80 p-5 shadow-lg shadow-slate-200/60 backdrop-blur-sm">
            <div class="mb-10 flex items-center gap-3 mt-2">
                <img src="https://avatars.githubusercontent.com/u/111075940?s=400&u=0f1e7c5d9a2b6e4f0c1e3b5f4c6d7e8f9a0b1c2d&v=4"
                    alt="Profile Picture" class="h-12 w-12 rounded-full object-cover" />
                <div>
                    <a href="/login">
                        <h2 class="text-lg font-semibold text-slate-900" id="user-name">User name</h2>
                        <p class="text-sm text-slate-500">Student</p>
                    </a>
                </div>

            </div>

            <nav class="space-y-2">
                <a href="/"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
                    <i class="bi bi-house"></i>
                    Dashboard
                </a>
                <a href="/subjects"
                    class="flex items-center gap-3 rounded-xl bg-blue-600 px-3 py-2.5 font-medium text-white shadow-sm shadow-blue-200 transition hover:bg-blue-500">
                    <i class="bi bi-book"></i>
                    My Subjects
                </a>
                <a href="/notebook"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
                    <i class="bi bi-journal"></i>
                    Notebook
                </a>
                <a href="/knowledge"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
                    <i class="bi bi-lightbulb"></i>
                    Knowledge
                </a>
                <a href="/study"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
                    <i class="bi bi-graph-up-arrow"></i>
                    Study
                </a>
                <a href="/exam"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
                    <i class="bi bi-file-earmark"></i>
                    Exams
                </a>
                
                <a href="/settings"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
                    <i class="bi bi-gear"></i>
                    Settings
                </a>
<button onclick="logout()"
                    class="flex items-center w-full gap-3 rounded-xl px-3 py-2.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
                    <i class="bi bi-box-arrow-left"></i>
                    Logout
                </button>
            </nav>
        </aside>

        <div class="flex flex-col w-full">

            <div class="mt-auto w-full h-full rounded-2xl border border-slate-200 bg-white/80 p-5 shadow-lg shadow-slate-200/60 backdrop-blur-sm">

                <header class="mb-6 flex flex-col gap-5 sm:flex-row sm:items-start sm:justify-between">
                    <div>
                        <p class="text-xs font-bold uppercase tracking-[0.18em] text-blue-600">
                            Subject Information
                        </p>

                        <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900" id="subject-name">
                            Subject Name
                        </h1>

                        <p class="mt-1 text-sm text-slate-500" id="subject-description">
                            Subject description goes here.
                        </p>
                    </div>
                </header>
            </div>
        </div>


        <aside
            class="w-full max-w-[350px] rounded-2xl border border-slate-200 bg-white/80 p-5 shadow-lg shadow-slate-200/60 backdrop-blur-sm right">
            <!-- Calendar on top and exams on bottom -->
            <div class="w-full max-w-md bg-white rounded-2xl">

                <!-- Header -->
                <div class="flex items-center justify-between mb-6">
                    <button id="prevBtn" class="w-10 h-10 rounded-full hover:bg-gray-100 text-gray-600 text-xl">
                        &#8249;
                    </button>

                    <h2 id="monthYear" class="text-xl font-semibold text-gray-800"></h2>

                    <button id="nextBtn" class="w-10 h-10 rounded-full hover:bg-gray-100 text-gray-600 text-xl">
                        &#8250;
                    </button>
                </div>

                <!-- Weekdays -->
                <div class="grid grid-cols-7 mb-2 text-center">
                    <div class="text-sm font-medium text-gray-400">Sun</div>
                    <div class="text-sm font-medium text-gray-400">Mon</div>
                    <div class="text-sm font-medium text-gray-400">Tue</div>
                    <div class="text-sm font-medium text-gray-400">Wed</div>
                    <div class="text-sm font-medium text-gray-400">Thu</div>
                    <div class="text-sm font-medium text-gray-400">Fri</div>
                    <div class="text-sm font-medium text-gray-400">Sat</div>
                </div>

                <!-- Calendar -->
                <div id="calendar" class="grid grid-cols-7 gap-1"></div>

                <!-- Selected date -->
                <div class="mt-6 p-4 bg-gray-50 rounded-xl text-center">
                    <p class="text-sm text-gray-500">Selected date</p>
                    <p id="selectedDate" class="font-semibold text-gray-800 mt-1">
                        None
                    </p>
                </div>

            </div>

            <div class="mt-8">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Upcoming Exams</h3>
                <ul class="space-y-2" id="upcomingExams">
                    
                </ul>
            </div>
        </aside>
    </div>

    <div id="errorModal"
        class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-950/40 p-4 backdrop-blur-sm"
        role="dialog" aria-modal="true" aria-labelledby="errorModalTitle" aria-describedby="errorModalMessage">
        <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl">
            <div class="flex items-start gap-4">
                <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-red-100 text-red-600">
                    <i class="bi bi-exclamation-triangle-fill text-xl" aria-hidden="true"></i>
                </div>
                <div class="min-w-0 flex-1">
                    <div class="flex items-start justify-between gap-4">
                        <h2 id="errorModalTitle" class="text-lg font-semibold text-slate-900">Something went wrong</h2>
                        <button id="closeErrorModal" type="button"
                            class="rounded-lg p-1 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700"
                            aria-label="Close error message">
                            <i class="bi bi-x-lg" aria-hidden="true"></i>
                        </button>
                    </div>
                    <p id="errorModalMessage" class="mt-2 text-sm leading-6 text-slate-600"></p>
                </div>
            </div>
            <button id="errorModalOk" type="button"
                class="mt-6 w-full rounded-lg bg-blue-600 px-4 py-2.5 font-medium text-white transition hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                OK
            </button>
        </div>
    </div>

</body>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/errorHandler.js"></script>
<script src="/js/subjectInfo.js"></script>
<script src="/js/calendar.js"></script>
<script src="/js/user.js"></script>


</html>
