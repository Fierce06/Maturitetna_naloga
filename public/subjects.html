<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Maturitetna naloga</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100 text-slate-800 page-subjects">
    <div class=" flex min-h-screen gap-6 p-4 md:p-8">
        <aside
            class="w-full max-w-[260px] rounded-2xl border border-slate-200 bg-white/80 p-5 shadow-lg shadow-slate-200/60 backdrop-blur-sm">
            <div class="mb-14 flex items-center gap-3">
                <img src="https://avatars.githubusercontent.com/u/111075940?s=400&u=0f1e7c5d9a2b6e4f0c1e3b5f4c6d7e8f9a0b1c2d&v=4"
                    alt="Profile Picture" class="h-12 w-12 rounded-full object-cover" />
                <div>
                    <h2 class="text-lg font-semibold text-slate-900" id="user-name">User name</h2>
                    <p class="text-sm text-slate-500">Student</p>
                </div>

            </div>

            <nav class="space-y-2">
                <a href="/"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
                    <i class="bi bi-house"></i>
                    Dashboard
                </a>
                <a href="/subjects"
                    class="flex items-center gap-3 rounded-xl bg-blue-600 px-3 py-2.5 font-medium text-white shadow-sm shadow-blue-200 transition hover:bg-blue-500">
                    <i class="bi bi-book"></i>
                    My Subjects
                </a>
                <a href="/notebook"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
                    <i class="bi bi-journal"></i>
                    Notebook
                </a>
                <a href="/knowledge"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
                    <i class="bi bi-lightbulb"></i>
                    Knowledge
                </a>
                <a href="/study"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
                    <i class="bi bi-graph-up-arrow"></i>
                    Study
                </a>
                <a href="/exam"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
                    <i class="bi bi-file-earmark"></i>
                    Exams
                </a>
                <a href="/calendar"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
                    <i class="bi bi-calendar-week"></i>
                    Calendar
                </a>
                <a href="/settings"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900">
                    <i class="bi bi-gear"></i>
                    Settings
                </a>
            </nav>
        </aside>


        <!-- Add Subject Modal -->
        <div id="subjectModal"
            class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 p-3 backdrop-blur-sm">

            <div class="w-full max-w-xl overflow-hidden rounded-xl bg-white shadow-xl">

                <!-- Header -->
                <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3">
                    <div>
                        <h2 class="text-lg font-semibold text-slate-900">Add new subject</h2>
                        <p class="mt-0.5 text-xs text-slate-500">Customize your new study subject.</p>
                    </div>
                    <button type="button" id="closeSubjectModal"
                        class="flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-700">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>

                <!-- Form -->
                <form id="subjectForm" class="space-y-3 p-4">

                    <!-- Name -->
                    <div>
                        <label for="subjectName" class="mb-1 block text-xs font-medium text-slate-700">
                            Subject name <span class="text-red-500">*</span>
                        </label>
                        <input id="subjectName" name="name" type="text" required maxlength="60"
                            placeholder="e.g. Mathematics"
                            class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/10">
                    </div>

                    <!-- Description -->
                    <div>
                        <label for="subjectDescription" class="mb-1 block text-xs font-medium text-slate-700">
                            Description
                        </label>
                        <textarea id="subjectDescription" name="description" rows="2" maxlength="300"
                            placeholder="What will you study in this subject?"
                            class="w-full resize-none rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/10"></textarea>
                    </div>

                    <!-- Color -->
                    <div>
                        <label class="mb-2 block text-xs font-medium text-slate-700">Subject color</label>
                        <div class="flex flex-wrap items-center gap-2" id="subjectColors">
                            <button type="button" data-color="#3b82f6"
                                class="color-option h-7 w-7 rounded-full bg-blue-500 ring-2 ring-blue-500 ring-offset-2"
                                aria-label="Blue" aria-pressed="true"></button>

                            <button type="button" data-color="#8b5cf6"
                                class="color-option h-7 w-7 rounded-full bg-violet-500" aria-label="Purple"
                                aria-pressed="false"></button>

                            <button type="button" data-color="#10b981"
                                class="color-option h-7 w-7 rounded-full bg-emerald-500" aria-label="Green"
                                aria-pressed="false"></button>

                            <button type="button" data-color="#f59e0b"
                                class="color-option h-7 w-7 rounded-full bg-amber-500" aria-label="Orange"
                                aria-pressed="false"></button>

                            <button type="button" data-color="#ef4444"
                                class="color-option h-7 w-7 rounded-full bg-red-500" aria-label="Red"
                                aria-pressed="false"></button>

                            <button type="button" data-color="#ec4899"
                                class="color-option h-7 w-7 rounded-full bg-pink-500" aria-label="Pink"
                                aria-pressed="false"></button>

                            <button type="button" data-color="#64748b"
                                class="color-option h-7 w-7 rounded-full bg-slate-500" aria-label="Slate"
                                aria-pressed="false"></button>

                            <label
                                class="relative flex h-7 w-7 cursor-pointer items-center justify-center overflow-hidden rounded-full border border-slate-200"
                                title="Custom color">
                                <i class="bi bi-eyedropper text-sm text-slate-600"></i>
                                <input id="customSubjectColor" name="color" type="color" value="#3b82f6"
                                    class="absolute inset-0 h-full w-full cursor-pointer opacity-0">
                            </label>
                        </div>
                    </div>

                    <!-- Icon -->
                    <div>
                        <label class="mb-2 block text-xs font-medium text-slate-700">Choose an icon</label>

                        <div id="subjectIcons" class="grid grid-cols-6 gap-2">
                            <button type="button" data-icon="bi-calculator"
                                class="icon-option flex h-9 items-center justify-center rounded-lg border-2 border-blue-500 bg-blue-50 text-lg text-blue-600"
                                aria-label="Calculator" aria-pressed="true">
                                <i class="bi bi-calculator"></i>
                            </button>

                            <button type="button" data-icon="bi-book"
                                class="icon-option flex h-9 items-center justify-center rounded-lg border border-slate-200 text-lg text-slate-600 hover:bg-slate-50"
                                aria-label="Book" aria-pressed="false">
                                <i class="bi bi-book"></i>
                            </button>

                            <button type="button" data-icon="bi-code-slash"
                                class="icon-option flex h-9 items-center justify-center rounded-lg border border-slate-200 text-lg text-slate-600 hover:bg-slate-50"
                                aria-label="Programming" aria-pressed="false">
                                <i class="bi bi-code-slash"></i>
                            </button>

                            <button type="button" data-icon="bi-flask"
                                class="icon-option flex h-9 items-center justify-center rounded-lg border border-slate-200 text-lg text-slate-600 hover:bg-slate-50"
                                aria-label="Science" aria-pressed="false">
                                <i class="bi bi-flask"></i>
                            </button>

                            <button type="button" data-icon="bi-globe"
                                class="icon-option flex h-9 items-center justify-center rounded-lg border border-slate-200 text-lg text-slate-600 hover:bg-slate-50"
                                aria-label="Geography" aria-pressed="false">
                                <i class="bi bi-globe"></i>
                            </button>

                            <button type="button" data-icon="bi-translate"
                                class="icon-option flex h-9 items-center justify-center rounded-lg border border-slate-200 text-lg text-slate-600 hover:bg-slate-50"
                                aria-label="Languages" aria-pressed="false">
                                <i class="bi bi-translate"></i>
                            </button>

                            <button type="button" data-icon="bi-music-note-beamed"
                                class="icon-option flex h-9 items-center justify-center rounded-lg border border-slate-200 text-lg text-slate-600 hover:bg-slate-50"
                                aria-label="Music" aria-pressed="false">
                                <i class="bi bi-music-note-beamed"></i>
                            </button>

                            <button type="button" data-icon="bi-palette"
                                class="icon-option flex h-9 items-center justify-center rounded-lg border border-slate-200 text-lg text-slate-600 hover:bg-slate-50"
                                aria-label="Art" aria-pressed="false">
                                <i class="bi bi-palette"></i>
                            </button>

                            <button type="button" data-icon="bi-lightbulb"
                                class="icon-option flex h-9 items-center justify-center rounded-lg border border-slate-200 text-lg text-slate-600 hover:bg-slate-50"
                                aria-label="Ideas" aria-pressed="false">
                                <i class="bi bi-lightbulb"></i>
                            </button>

                            <button type="button" data-icon="bi-journal-text"
                                class="icon-option flex h-9 items-center justify-center rounded-lg border border-slate-200 text-lg text-slate-600 hover:bg-slate-50"
                                aria-label="Notes" aria-pressed="false">
                                <i class="bi bi-journal-text"></i>
                            </button>

                            <button type="button" data-icon="bi-graph-up"
                                class="icon-option flex h-9 items-center justify-center rounded-lg border border-slate-200 text-lg text-slate-600 hover:bg-slate-50"
                                aria-label="Statistics" aria-pressed="false">
                                <i class="bi bi-graph-up"></i>
                            </button>

                            <button type="button" data-icon="bi-bookmark-star"
                                class="icon-option flex h-9 items-center justify-center rounded-lg border border-slate-200 text-lg text-slate-600 hover:bg-slate-50"
                                aria-label="Favorite" aria-pressed="false">
                                <i class="bi bi-bookmark-star"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex justify-end gap-2 border-t border-slate-100 pt-3">
                        <button type="button" id="cancelSubjectModal"
                            class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-50">
                            Cancel
                        </button>
                        <button type="submit"
                            class="flex items-center gap-2 rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-blue-500">
                            <i class="bi bi-plus-lg"></i>
                            Create subject
                        </button>
                    </div>

                </form>
            </div>
        </div>



        <div class="flex flex-col w-full">

            <div
                class="mt-auto w-full rounded-2xl border border-slate-200 bg-white/80 p-5 shadow-lg shadow-slate-200/60 backdrop-blur-sm">

                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-lg font-semibold text-gray-800">My Subjects</h2>

                    <div class="flex items-center gap-2">

                        <button id="openSubjectModal" type="button"
                            class="flex items-center gap-2 rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm shadow-blue-200 transition hover:bg-blue-500">
                            <i class="bi bi-plus-lg"></i>
                            Add Subject
                        </button>


                        <button
                            class="flex items-center gap-2 rounded-lg bg-gray-100 px-4 py-2 text-sm font-medium text-gray-800 shadow-sm shadow-gray-200 transition hover:bg-gray-200">
                            <i class="bi bi-funnel"></i>
                            Filter
                        </button>

                        <button
                            class="flex items-center gap-2 rounded-lg bg-gray-100 px-4 py-2 text-sm font-medium text-gray-800 shadow-sm shadow-gray-200 transition hover:bg-gray-200">
                            <i class="bi bi-pencil"></i>
                            Edit
                        </button>
                    </div>

                </div>


                <ul id="subjectList" class="grid grid-cols-[repeat(auto-fit,minmax(280px,1fr))] col-span-3 gap-3">

                </ul>

            </div>

        </div>

        <aside
            class="w-full max-w-[350px] rounded-2xl border border-slate-200 bg-white/80 p-5 shadow-lg shadow-slate-200/60 backdrop-blur-sm right">
            <!-- Calendar on top and exams on bottom -->
            <div class="w-full max-w-md bg-white rounded-2xl">

                <!-- Header -->
                <div class="flex items-center justify-between mb-6">
                    <button id="prevBtn" class="w-10 h-10 rounded-full hover:bg-gray-100 text-gray-600 text-xl">
                        &#8249;
                    </button>

                    <h2 id="monthYear" class="text-xl font-semibold text-gray-800"></h2>

                    <button id="nextBtn" class="w-10 h-10 rounded-full hover:bg-gray-100 text-gray-600 text-xl">
                        &#8250;
                    </button>
                </div>

                <!-- Weekdays -->
                <div class="grid grid-cols-7 mb-2 text-center">
                    <div class="text-sm font-medium text-gray-400">Sun</div>
                    <div class="text-sm font-medium text-gray-400">Mon</div>
                    <div class="text-sm font-medium text-gray-400">Tue</div>
                    <div class="text-sm font-medium text-gray-400">Wed</div>
                    <div class="text-sm font-medium text-gray-400">Thu</div>
                    <div class="text-sm font-medium text-gray-400">Fri</div>
                    <div class="text-sm font-medium text-gray-400">Sat</div>
                </div>

                <!-- Calendar -->
                <div id="calendar" class="grid grid-cols-7 gap-1"></div>

                <!-- Selected date -->
                <div class="mt-6 p-4 bg-gray-50 rounded-xl text-center">
                    <p class="text-sm text-gray-500">Selected date</p>
                    <p id="selectedDate" class="font-semibold text-gray-800 mt-1">
                        None
                    </p>
                </div>

            </div>

            <div class="mt-8">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Upcoming Exams</h3>
                <ul class="space-y-4">
                    <li class="p-4 bg-gray-50 rounded-xl shadow-sm hover:shadow-md transition">
                        <div class="flex justify-between items-center">
                            <span class="font-medium text-gray-800">Math Exam</span>
                            <span class="text-sm text-gray-500">June 15, 2024</span>
                        </div>
                    </li>
                </ul>
        </aside>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/subjects.js"></script>
    <script src="js/calendar.js"></script>
</body>

</html>
